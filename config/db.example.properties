# BugTrack database configuration (template)
#
# Copy this file to config/db.properties and fill in your own values.
# config/db.properties is ignored by Git, so your password never gets committed.

db.url=jdbc:mysql://localhost:3306/bugtrack?useSSL=false&serverTimezone=UTC
db.username=bugtrack
db.password=change-me

# HikariCP connection pool
db.pool.maximumSize=10
db.pool.minimumIdle=2
